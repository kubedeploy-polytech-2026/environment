name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read
  attestations: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test request creation
        run: python3 -m unittest discover -s tests -v
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Verify published release inputs without creating a request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/request_deployment.py --backend-tag v0.1.0 --frontend-tag v0.1.0 --dry-run
