apiVersion: score.dev/v1b1
metadata:
  name: frontend
containers:
  web:
    image: .
    variables:
      BACKEND_UPSTREAM: backend:8080
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    readinessProbe:
      httpGet:
        path: /health
        port: 8080
    livenessProbe:
      httpGet:
        path: /health
        port: 8080
service:
  ports:
    http:
      port: 8080
      targetPort: 8080
resources:
  route:
    type: route
    class: gateway
    params:
      path: /
      port: 8080
