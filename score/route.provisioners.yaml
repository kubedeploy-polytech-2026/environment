- uri: template://kubedeploy/http-route
  type: route
  class: gateway
  description: Attach an application to the shared platform Gateway.
  init: |
    {{ if not (hasPrefix "/" .Params.path) }}{{ fail "route path must start with /" }}{{ end }}
    {{ $ports := (index .WorkloadServices .SourceWorkload).Ports }}
    {{ $port := index $ports (print .Params.port) }}
    {{ if not $port.TargetPort }}{{ fail "route port does not match a Service port" }}{{ end }}
  supported_params:
    - path
    - port
  manifests: |
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: {{ .SourceWorkload }}-http
        namespace: {{ .Namespace }}
      spec:
        parentRefs:
          - name: kubedeploy
            namespace: kubedeploy-gateway
            sectionName: http
        hostnames:
          - kubedeploy.local
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: {{ .Params.path | quote }}
            backendRefs:
              - name: {{ (index .WorkloadServices .SourceWorkload).ServiceName }}
                port: {{ .Params.port }}
