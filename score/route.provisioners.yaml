- uri: template://kubedeploy/backend-route
  type: route
  class: gateway
  description: Attach the backend API to the shared platform Gateway.
  manifests: |
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: backend-http
        namespace: {{ .Namespace }}
      spec:
        parentRefs:
          - name: kubedeploy
            namespace: kubedeploy-gateway
            sectionName: http
        hostnames:
          - kubedeploy.local
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api
            backendRefs:
              - name: {{ (index .WorkloadServices .SourceWorkload).ServiceName }}
                port: 8080
