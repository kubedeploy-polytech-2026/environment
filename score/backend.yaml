apiVersion: score.dev/v1b1
metadata:
  name: backend
containers:
  api:
    image: .
    variables:
      DATABASE_URL: ${resources.database.url}
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    readinessProbe:
      httpGet:
        path: /readyz
        port: 8080
    livenessProbe:
      httpGet:
        path: /health
        port: 8080
service:
  ports:
    http:
      port: 8080
      targetPort: 8080
resources:
  database:
    type: postgres
    class: existing
  route:
    type: route
    class: gateway
    params:
      path: /api
      port: 8080
