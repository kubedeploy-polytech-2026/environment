apiVersion: score.dev/v1b1
metadata:
  name: backend
containers:
  api:
    image: .
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 32Mi
    readinessProbe:
      httpGet:
        path: /health
        port: 8080
    livenessProbe:
      httpGet:
        path: /health
        port: 8080
service:
  ports:
    http:
      port: 8080
      targetPort: 8080
resources:
  route:
    type: route
    class: gateway
